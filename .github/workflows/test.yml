name: test and publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm test
        env:
          # A few e2e tests do a global install/link (`npm install -g`,
          # `npm link`, `npx`) against the *published* package, not this
          # build. They are slow, mutate the runner and used to fail CI with
          # a 5s timeout, so they are always skipped here.
          IGNORE_TEST: "1"

      # A `v*` tag must match package.json, so we never tag the wrong version.
      - name: Validate tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      # npm's trusted publishing (OIDC) needs npm >= 11.5.1 to exchange the
      # workflow id-token; the npm bundled with Node 22 is 10.x, which cannot.
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          npm install -g npm@11
          npm --version

      # Idempotent: publishing an already-published version would fail otherwise.
      # Runs on a v* tag push, or manually via workflow_dispatch (to publish the
      # version currently in package.json without re-tagging).
      - name: Publish to npm (skip if already published)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "@garndev/tepi@$PKG" version >/dev/null 2>&1; then
            echo "@garndev/tepi@$PKG is already published - skipping."
            exit 0
          fi
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publishing @garndev/tepi@$PKG (OIDC exchange takes precedence in CI)."
          else
            echo "Publishing @garndev/tepi@$PKG with trusted publishing (OIDC): no NPM_TOKEN secret configured."
          fi
          # Without a token, npm exchanges the workflow OIDC id-token against
          # the trusted publisher configured on npmjs.com. If that is not set
          # up, npm fails with ENEEDAUTH instead of npm's cryptic 404.
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
