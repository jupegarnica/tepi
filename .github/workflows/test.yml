name: test and publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm test
        env:
          # A few e2e tests do a global install/link (`npm install -g`,
          # `npm link`, `npx`) against the *published* package, not this
          # build. They are slow, mutate the runner and used to fail CI with
          # a 5s timeout, so they are always skipped here.
          IGNORE_TEST: "1"

      # A `v*` tag must match package.json, so we never tag the wrong version.
      - name: Validate tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      # Idempotent: publishing an already-published version would fail otherwise.
      # Runs on a v* tag push, or manually via workflow_dispatch (to publish the
      # version currently in package.json without re-tagging).
      - name: Publish to npm (skip if already published)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "@garndev/tepi@$PKG" version >/dev/null 2>&1; then
            echo "@garndev/tepi@$PKG is already published - skipping."
            exit 0
          fi
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            # Fail with a clear message instead of npm's cryptic
            # "404 Not Found - PUT .../@scope%2fpkg" (that is what an
            # invalid/expired token looks like on a publish).
            if ! npm whoami >/dev/null 2>&1; then
              echo "::error::NPM_TOKEN is invalid or expired. Update the repo secret, or delete it and configure a trusted publisher (OIDC) for this repo on npmjs.com."
              exit 1
            fi
            npm publish --access public
          else
            # No token: npm exchanges the workflow OIDC id-token (trusted
            # publisher configured on npmjs.com).
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
